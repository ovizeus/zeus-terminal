<!--
=====================================================================================
 ZeuS BRAIN v7 — VISUAL REFERENCE IMPLEMENTATION
 Read together with docs/design/ZEUS_BRAIN_SPEC.md (the spec wins if they disagree).

 THIS FILE RUNS ON SIMULATED DATA. Sections are marked:
   [CONFIG]      constants, colors, strings          -> PORT
   [DEMO-SIM]    fake market, fake trades, seeded history, demo buttons -> DO NOT PORT
   [RECORDER]    4 Hz frame recorder, trade capture   -> PORT, wired to real events
   [DERIVED]     render-only derived values (mood, intent, consensus, sleep) -> PORT (inputs = real data)
   [RENDER]      all canvas drawing                   -> PORT EXACTLY
   [UI]          DOM, journal, modal, replay, share, psych, tap-to-explain -> PORT
 The `st` object passed to render() is THE CONTRACT: production must build the same
 object from real ZeuS state (see SPEC section 3).
=====================================================================================
-->

<script>
'use strict';
// ================================= [CONFIG] =================================
const STR={ // all user-facing strings in one place (i18n-ready)
 idle:'Tap anything to see what it means.',
 noTrades:'No trades yet. Each entry is captured automatically.',
 viewAll:n=>`View all trades (${n})`,
 allTitle:n=>`ALL TRADES (${n})`,
 noReplay:'Replay not stored for this trade (only the last 50 trades keep replay frames).',
 replayStart:id=>`Replaying trade #${id} from ~12s before entry. Tap the mood strip to jump, tap the replay label to exit.`,
 replayEnd:'Replay finished. Back to live.',back:'Back to live.',
 shareReady:'Share card ready below the journal: brain at entry, result, mood and @zeusterminal.',
 woke:'Woke up: the market started moving again.',
 collecting:(n,m)=>`collecting data · ${n}/${m} trades`,
 na:'not available yet',
 dv:'Déjà vu compares the current shape with the shape at every past entry and shows the closest matches with their results. It is a hint, not a signal: below ~100 trades the numbers are noisy.',
 tpl:'Template is the gold dashed ghost on the radar: the entry shape of your best winning trade. Match shows how close the current shape is to it.',
 psych:'Psych report groups your past trades by the mood right before entry and shows the win rate of each. Rows with fewer than 30 trades are marked low.',
 moodNote:'The mood is display only, it never changes trading decisions.',
 shape:'Main shape is the real-time lens. Thin line is timeframe, dashed is slow, white dotted is intent, gold dashed is your best trade template. Blur means low ML confidence; trembling means fast and slow disagree.',
};
const S=360,C=S/2,R=100,SEG=Math.PI*2/7;
const AX=['TREND','DELTA','FLOW','OI','VOL','FUND','VOLAT','IMB','MOM','SENT','STRUCT','LIQ'],N=AX.length;
const AXD=['trend strength across timeframes','aggressive buy vs sell delta','order flow pressure','open interest change','volume vs average','funding rate bias','volatility regime','order book imbalance','momentum','market sentiment','market structure','liquidation pressure'];
const GN=['RISK','SPREAD','COOL','VOLAT','SESS','NOOPP','REGIME'];
const GND=['risk limits','spread and slippage','cooldown after last trade','volatility window','trading session','no opposite position open','regime stability'];
const MODECOL={LONG:[57,255,106],SHORT:[255,77,109],SQUEEZE:[192,139,255],RANGE:[95,212,255]};
const MC={CALM:'#7fb8d6',ALERT:'#e6f56a',NERVOUS:'#ff9f6b',CONFUSED:'#c08bff',HESITANT:'#ffb347',ATTACK:'#ffffff',FOCUSED:'#9fe8ff',CONFIDENT:'#39ff6a',FEARFUL:'#ff4d6d',SLEEPING:'#5a6b85'};
const MX={CALM:'nothing is building, the brain is relaxed',ALERT:'confluence is close to the threshold, getting ready',NERVOUS:'fast and slow lenses disagree, the market is jumpy',CONFUSED:'ML confidence is low, the brain cannot read this market',HESITANT:'it wants to enter but a safety gate is blocking',ATTACK:'signal confirmed, entering now',FOCUSED:'in a position, managing it',CONFIDENT:'the position is well in profit',FEARFUL:'the position is close to the stop-loss',SLEEPING:'the market is dead, the brain rests and renders slower to save battery'};
const PRE_MOODS=['CALM','ALERT','NERVOUS','CONFUSED','HESITANT'];
const MIN_DEJAVU=10,MIN_TEMPLATE=1,LOW_SAMPLE=30,JOURNAL_SHOW=4,REPLAY_KEEP=50,REC_HZ=4,PRE_SEC=12,POST_SEC=2;
const LS_KEY='zeus.brain.ui';
const SAT_SLOT=[[40,40],[S-40,40],[S-40,S-40]];

// ================================= [DEMO-SIM] — DO NOT PORT =================================
const DEMO={THR:72,REG:[
{mode:'LONG',n:'LONG MODE',t:[.8,.6,.72,.5,.65,.3,.4,.7,.78,.6,.66,.35],ml:.88,gf:[],dir:1},
{mode:'SHORT',n:'SHORT MODE',t:[.2,.75,.65,.7,.6,.75,.5,.3,.25,.7,.35,.8],ml:.8,gf:[],dir:-1},
{mode:'SQUEEZE',n:'SQUEEZE',t:[.35,.85,.3,.92,.4,.8,.95,.45,.3,.4,.5,.9],ml:.5,gf:[6],dir:1},
{mode:'RANGE',n:'CHOP / RANGE',t:[.15,.25,.2,.3,.2,.15,.2,.5,.2,.45,.4,.2],ml:.28,gf:[3,6],dir:0}]};
const SYM=[{s:'BTC',reg:0},{s:'SOL',reg:0},{s:'ETH',reg:2},{s:'BNB',reg:1}];
SYM.forEach(y=>{y.v=DEMO.REG[y.reg].t.slice();y.sw=Math.random()*8;y.sc=50;});
const hist=[]; // closed trades with entry shape (production: loaded from journal storage)
(function seedDemoHistory(){const W={CALM:.62,ALERT:.68,NERVOUS:.3,CONFUSED:.27,HESITANT:.44},MW=[.22,.34,.2,.1,.14];
 for(let i=1;i<=60;i++){let r=Math.random(),m=0;while(m<4&&r>MW[m]){r-=MW[m];m++;}const pre=PRE_MOODS[m],win=Math.random()<W[pre],rg=DEMO.REG[Math.floor(Math.random()*3)];
 hist.push({id:i,demo:true,pre,result:win?'TP':'SL',pnlPct:win?2.4:-1.2,confAtEntry:72+Math.floor(Math.random()*12),entryShape:rg.t.map(v=>Math.min(1,Math.max(0,v+(Math.random()-.5)*.25))),symbol:'BTC',side:rg.dir>=0?'LONG':'SHORT'});}})();
let dm={main:0,auto:true,lastSw:0,prevOk:false,sigUntil:0,ml:.8,sleepT:0,pos:null,posMsg:'',posMsgUntil:0,tid:60};
let rt=DEMO.REG[0].t.slice(),tf=rt.slice(),sl=rt.map(x=>x*.6),att=AX.map(()=>.5);const ph=AX.map(()=>Math.random()*6.28);
const dreg=()=>SYM[dm.main].reg,others=()=>SYM.map((_,i)=>i).filter(i=>i!==dm.main);
document.querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>{SYM[dm.main].reg=+b.dataset.r;dm.auto=false;});
// demoTick() fakes what production reads from real ZeuS state. It returns RAW inputs + fires trade events.
function demoTick(t,dt){
 if(dm.auto&&t-dm.lastSw>9&&!dm.pos){SYM[dm.main].reg=(dreg()+1+Math.floor(Math.random()*2))%4;dm.lastSw=t;}
 SYM.forEach((y,i)=>{if(i!==dm.main&&t-y.sw>11){y.reg=Math.floor(Math.random()*4);y.sw=t;}const tg=DEMO.REG[y.reg].t;for(let k=0;k<N;k++)y.v[k]+=(Math.min(1,Math.max(0,tg[k]+Math.sin(t*1.5+k+i*3)*.08))-y.v[k])*.05;y.sc=Math.round(y.v.reduce((a,b)=>a+b)/N*100+20);});
 const rg=DEMO.REG[dreg()];
 for(let i=0;i<N;i++){const n=Math.sin(t*1.3+ph[i])*.08+Math.sin(t*3.7+ph[i]*1.7)*.05;rt[i]+=(Math.min(1,Math.max(0,rg.t[i]+n))-rt[i])*.09;tf[i]+=(rt[i]-tf[i])*.025;sl[i]+=(tf[i]-sl[i])*.007;const at=.5+.5*Math.sin(t*.4+ph[i]*3)*(dreg()===3?.4:1)*rg.t[i];att[i]+=(at-att[i])*.02;}
 dm.ml+=(Math.min(.98,Math.max(.1,rg.ml+Math.sin(t*.7)*.08))-dm.ml)*.02;
 const fails=[...rg.gf],div=rt.reduce((a,x,i)=>a+Math.abs(x-sl[i]),0)/N;
 const conf=Math.round(Math.min(99,rt.reduce((a,b)=>a+b)/N*100*(1-div*.8)+28+dm.ml*8));
 if(dreg()===3&&!dm.pos)dm.sleepT+=dt;else dm.sleepT=0;const dead=dm.sleepT>4;
 const ok=!dead&&conf>=DEMO.THR&&fails.length===0;
 if(ok&&!dm.prevOk){dm.sigUntil=t+2.2;if(!dm.pos){dm.pos={id:++dm.tid,symbol:SYM[dm.main].s,side:rg.dir>=0?'LONG':'SHORT',dir:rg.dir||1,p:0,t0:t};REC.onEntry(dm.pos.id,dm.pos.symbol,dm.pos.side,conf,DEMO.THR,t);}}dm.prevOk=ok;
 if(dm.pos){const drift=(rg.dir===dm.pos.dir?.12:rg.dir===0?-.02:-.18)*dm.ml;dm.pos.p+=(drift+(Math.random()-.5)*.9)*dt;let ex=null;
  if(dm.pos.p>=1)ex=['TP',2.4];else if(dm.pos.p<=-1)ex=['SL',-1.2];else if(t-dm.pos.t0>20)ex=['MANUAL',dm.pos.p*(dm.pos.p>0?2.4:1.2)];
  if(ex){dm.posMsg=(ex[0]==='MANUAL'?'CLOSED ':ex[0]+' HIT ')+(ex[1]>=0?'+':'')+ex[1].toFixed(2)+'%';dm.posMsgUntil=t+2.5;REC.onExit(dm.pos.id,ex[0],ex[1],t);dm.pos=null;}}
 // RAW INPUT CONTRACT (production builds this from real ZeuS state — SPEC section 3)
 return{rt:rt.slice(),tf:tf.slice(),sl:sl.slice(),att:att.slice(),ml:dm.ml,gatesFailing:fails,conf,thr:DEMO.THR,mode:rg.mode,modeLabel:rg.n,
  signalActive:t<dm.sigUntil,dead,
  position:dm.pos?{symbol:dm.pos.symbol,side:dm.pos.side,progress:dm.pos.p,pnlPct:dm.pos.p*(dm.pos.p>0?2.4:1.2)}:null,
  closeMsg:t<dm.posMsgUntil?dm.posMsg:'',
  main:SYM[dm.main].s,
  sats:others().map(si=>({symbol:SYM[si].s,axes:SYM[si].v.slice(),score:SYM[si].sc,mode:DEMO.REG[SYM[si].reg].mode}))};
}
function demoSwitchMain(sym){const si=SYM.findIndex(o=>o.s===sym);if(si<0)return;dm.main=si;rt=DEMO.REG[dreg()].t.map(v=>v*.4);dm.pos=null;dm.auto=false;dm.sleepT=0;}

// ================================= [RECORDER] =================================
// Records 4 Hz frames (ring buffer), captures entry snapshot, builds trade records.
// Production: onEntry/onExit are called from REAL engine/position events; storage = SPEC section 4.
const REC={frames:[],n:0,lastRec:0,open:new Map(),closing:[],trades:[],pendingEvt:null,snapQ:null,
 onEntry(id,symbol,side,conf,thr,t){const lastMood=DERIVED.lastPreMood;const tr={id,symbol,side,confAtEntry:conf,thrAtEntry:thr,pre:lastMood,entryShape:LIVE.rt.slice(),entryT:t,a:this.n,snapshot:null};this.open.set(id,tr);this.snapQ={tr,at:t+.35};},
 onExit(id,result,pnlPct,t){const tr=this.open.get(id);if(!tr)return;this.open.delete(id);tr.result=result;tr.pnlPct=pnlPct;tr.exitT=t;tr.b=this.n+POST_SEC*REC_HZ;this.pendingEvt=result;this.closing.push(tr);},
 tick(t,st){if(t-this.lastRec<1/REC_HZ)return;this.lastRec=t;this.frames.push(Object.assign({},st,{i:this.n++,evt:this.pendingEvt}));this.pendingEvt=null;if(this.frames.length>REC_HZ*60*20)this.frames.shift();
  for(let q=this.closing.length-1;q>=0;q--){const tr=this.closing[q];if(this.n>=tr.b){tr.frames=this.frames.filter(f=>f.i>=tr.a-PRE_SEC*REC_HZ&&f.i<=tr.b);this.trades.unshift(tr);
   this.trades.forEach((x,k)=>{if(k>=REPLAY_KEEP)x.frames=null;});hist.push(tr);this.closing.splice(q,1);pickBest();renderJournal();renderPsych();}}},
 snap(t,canvas){if(this.snapQ&&t>=this.snapQ.at&&!UI.rep){const c=document.createElement('canvas');c.width=c.height=240;c.getContext('2d').drawImage(canvas,0,0,canvas.width,canvas.height,0,0,240,240);this.snapQ.tr.snapshot=c.toDataURL('image/png');this.snapQ=null;}}};

// ================================= [DERIVED] (render-only, inputs = real data) =================================
const LIVE={rt:rt.slice()};
const DERIVED={lastPreMood:'CALM',
 build(raw){LIVE.rt=raw.rt;
  const div=raw.rt.reduce((a,x,i)=>a+Math.abs(x-raw.sl[i]),0)/N;
  const nF=raw.gatesFailing.length,hes=!raw.dead&&raw.conf>=raw.thr-8&&nF>0;
  const sats=raw.sats.map(s=>({s:s.symbol,v:s.axes,c:MODECOL[s.mode],sc:s.score,cons:s.mode!=='RANGE'&&dirOf(s.mode)===dirOf(raw.mode)}));
  let mood;const p=raw.position;
  if(raw.signalActive)mood='ATTACK';
  else if(p)mood=p.progress>.35?'CONFIDENT':p.progress<-.5?'FEARFUL':'FOCUSED';
  else if(raw.dead)mood='SLEEPING';else if(hes)mood='HESITANT';else if(raw.ml!=null&&raw.ml<.45)mood='CONFUSED';else if(div>.18)mood='NERVOUS';else if(raw.conf>=raw.thr-10)mood='ALERT';else mood='CALM';
  if(PRE_MOODS.includes(mood))this.lastPreMood=mood;
  return{rt:raw.rt,tf:raw.tf,sl:raw.sl,att:raw.att,ml:raw.ml,fails:raw.gatesFailing,conf:raw.conf,thr:raw.thr,hes,div,zz:raw.dead,c:MODECOL[raw.mode],n:raw.modeLabel,
   pos:p?{sym:p.symbol,dir:p.side==='LONG'?1:-1,pnl:p.progress,pct:p.pnlPct}:null,posMsg:raw.closeMsg,mood:[mood,MC[mood]],cons:sats.filter(s=>s.cons).length,sats,main:raw.main,sig:raw.signalActive};}};
function dirOf(m){return m==='SHORT'?-1:m==='RANGE'?0:1;}

// ================================= [RENDER] — port exactly =================================
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ms=document.getElementById('ms'),mx=ms.getContext('2d');
const dpr=window.devicePixelRatio||1;cv.width=S*dpr;cv.height=S*dpr;ctx.scale(dpr,dpr);ms.width=S*dpr;ms.height=26*dpr;mx.scale(dpr,dpr);
const ang=i=>-Math.PI/2+i*2*Math.PI/N;
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const simil=(a,b)=>Math.max(0,Math.min(1,1-a.reduce((s,x,i)=>s+Math.abs(x-b[i]),0)/a.length*2.2));
const clamp01=x=>Math.max(0,Math.min(1,x==null?0:x));
function pts(v,sc,wob,t,ox=0,oy=0,cx=C,cy=C,RR=R){return v.map((x,i)=>{const w=wob?Math.sin(t*7+i*2.1)*wob+Math.sin(t*11.3+i)*wob*.5:0;const r=RR*Math.max(.1,clamp01(x)+w)*sc;return[cx+ox+Math.cos(ang(i))*r,cy+oy+Math.sin(ang(i))*r];});}
function spline(p){const n=p.length;ctx.beginPath();for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];if(i===0)ctx.moveTo(p1[0],p1[1]);ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);}ctx.closePath();}
const RS={drt:rt.slice(),dtf:rt.slice(),dsl:sl.slice(),datt:att.slice(),dcol:[57,255,106],dml:.8,aura:0,sec:1,dz:0,beatPh:0,skip:0,prevSig:false,prevMood:'',prevZz:false,lastI:-1,last:null,gvd:new Array(7).fill(1),flash:new Array(N).fill(0),waves:[],parts:[],hl:null};
function render(st,t,dt,rp){const r=RS;r.last=st;const k=rp?.18:.5;
 for(let i=0;i<N;i++){r.drt[i]+=(clamp01(st.rt[i])-r.drt[i])*k;r.dtf[i]+=(clamp01(st.tf[i])-r.dtf[i])*k;r.dsl[i]+=(clamp01(st.sl[i])-r.dsl[i])*k;r.datt[i]+=((st.att?st.att[i]:.5)-r.datt[i])*k;}
 for(let c=0;c<3;c++)r.dcol[c]+=(st.c[c]-r.dcol[c])*.05;r.dml+=((st.ml==null?.7:st.ml)-r.dml)*.05;r.dz+=((st.zz?1:0)-r.dz)*.04;
 const fs=new Set(st.fails);for(let g=0;g<7;g++)r.gvd[g]+=((fs.has(g)?0:1)-r.gvd[g])*.08;
 r.aura+=((st.pos?Math.max(-1,Math.min(1,st.pos.pnl)):0)-r.aura)*.1;r.sec+=(((st.hes||st.pos)?.4:1)-r.sec)*.05;
 const fresh=st.i===undefined||st.i!==r.lastI;r.lastI=st.i;
 if(st.sig&&!r.prevSig){r.waves.push(t);FX.sound('attack');}r.prevSig=st.sig;
 if(fresh&&st.evt){if(st.evt==='TP'){r.waves.push(t);FX.sound('tp');}else FX.sound(st.evt==='SL'?'sl':'close');}
 if(st.mood[0]==='HESITANT'&&r.prevMood!=='HESITANT')FX.sound('hes');r.prevMood=st.mood[0];
 if(r.prevZz&&!st.zz){r.waves.push(t);FX.sound('wake');if(!rp)UI.info(STR.woke);}r.prevZz=st.zz;
 const col=r.dcol,hes=st.hes,conf=st.conf,mlv=r.dml,sleepy=r.dz>.5,focus=UI.focus;
 const period=(5-3*r.drt[6])*(1-r.dz)+8*r.dz,br=1+(.02+r.dz*.03)*Math.sin(t*2*Math.PI/period);
 ctx.clearRect(0,0,S,S);ctx.globalAlpha=r.sec;
 // satellites + consensus beams
 const bst=Math.max(...st.sats.map(q=>q.sc));

  if(y.cons){ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo((sx+C)/2+(sy-C)*.25,(sy+C)/2-(sx-C)*.25,C,C);ctx.setLineDash([2,6]);ctx.lineDashOffset=-t*25;ctx.strokeStyle=rgba(c,.45);ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([]);}

function makeCard(tr){const W=720,H=900,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),col=tr.pnlPct>0?'#39ff6a':'#ff4d6d',lbl=tr.result==='MANUAL'?'CLOSED':tr.result;
 const draw=im=>{x.fillStyle='#040913';x.fillRect(0,0,W,H);x.strokeStyle='#1d2c40';x.lineWidth=3;x.strokeRect(12,12,W-24,H-24);
  x.fillStyle='#e8eef6';x.font='500 52px serif';x.fillText("ZEU'S",48,96);x.fillStyle='#7c8ea3';x.font='500 20px monospace';x.fillText('AI TRADING ANALYTICS',50,130);
  if(im)x.drawImage(im,90,160,540,540);
  x.fillStyle='#d8e4f0';x.font='500 30px monospace';x.fillText('#'+tr.id+' '+tr.symbol+' '+tr.side,48,752);
  x.fillStyle=col;x.font='500 56px monospace';x.fillText(lbl+' '+(tr.pnlPct>=0?'+':'')+tr.pnlPct.toFixed(2)+'%',48,818);
  x.fillStyle='#7c8ea3';x.font='500 22px monospace';x.fillText('mood before entry: '+tr.pre+' · conf '+tr.confAtEntry,48,858);
  x.textAlign='right';x.fillStyle='#c08bff';x.fillText('@zeusterminal',W-48,96);
  const url=c.toDataURL('image/png');$('share').innerHTML=`<div style="padding:10px 0;border-top:1px solid #142235;"><img src="${url}" alt="Share card for trade ${tr.id}" style="width:100%;border-radius:10px;display:block;"><div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;font-size:11px;color:#7c8ea3;"><span>Long-press the image to save or share</span><button id="shx" style="color:#9fb3c8;border-color:#2a3a4d;padding:4px 10px;font-size:11px;">Close</button></div></div>`;$('shx').onclick=()=>{$('share').innerHTML='';};};
 if(tr.snapshot){const im=new Image();im.onload=()=>draw(im);im.src=tr.snapshot;}else draw(null);}
function drawStrip(src,cur,slots){mx.clearRect(0,0,S,26);mx.fillStyle='rgba(120,160,210,.07)';mx.fillRect(0,4,S,18);const n=src.length;if(!n)return;const w=S/(slots||n);
 for(let i=0;i<n;i++){const f=src[i],x=i*w;mx.globalAlpha=.75;mx.fillStyle=f.mood[1];mx.fillRect(x,4,w+.6,18);mx.globalAlpha=1;
  if(f.sig&&(i===0||!src[i-1].sig)){mx.fillStyle='#ffffff';mx.fillRect(x,0,2,26);}
  if(f.evt){mx.fillStyle=f.evt==='TP'?'#39ff6a':f.evt==='SL'?'#ff4d6d':'#9fb3c8';mx.fillRect(x,0,2,26);}}
 if(cur!=null){mx.fillStyle='#ffffff';mx.fillRect(cur*S-1,0,2,26);}}
const STRIP=REC_HZ*180;
ms.onclick=e=>{const b=ms.getBoundingClientRect(),x=(e.clientX-b.left)*S/b.width;
 if(UI.rep){const L=UI.rep.tr.frames.length,i=Math.max(0,Math.min(L-1,Math.floor(x/S*L)));UI.rep.idx=i;RS.prevSig=UI.rep.tr.frames[i].sig;UI.info('Jumped to '+Math.round(i/REC_HZ)+'s in the replay: '+UI.rep.tr.frames[i].mood[0]+'.');return;}
 const src=REC.frames.slice(-STRIP),i=Math.floor(x/(S/STRIP));if(i>=src.length){UI.info('Mood strip: no history yet at this point. It fills from left to right.');return;}
 const f=src[i],age=Math.round((src.length-1-i)/REC_HZ);UI.info((age?age+'s ago':'now')+': '+f.mood[0]+', conf '+f.conf+'. White ticks are entries, green and red are TP and SL.');};
cv.onclick=e=>{const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*S/b.width,y=(e.clientY-b.top)*S/b.height,vs=RS.last;if(!vs)return;
 for(let q=0;q<vs.sats.length;q++){const [sx,sy]=SAT_SLOT[q];if(Math.hypot(x-sx,y-sy)<32){if(UI.rep){UI.info(vs.sats[q].s+' satellite, score '+vs.sats[q].sc+'. Exit replay to switch.',{x:sx,y:sy,r:30});return;}
  demoSwitchMain(vs.sats[q].s); // PRODUCTION: call the EXISTING ZeuS symbol-switch function instead
  UI.info('Main brain switched to '+vs.sats[q].s+'. Satellites are the other scanned symbols; the brightest has the best score, beams show agreement.',{x:sx,y:sy,r:30});return;}}
 const dx=x-C,dy=y-C,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx),na=(((a+Math.PI/2)%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
 if(d<32){UI.info('Core: heartbeat speed follows confluence ('+vs.conf+'). The ring fills toward the entry threshold ('+vs.thr+'). Amber and irregular means hesitating; slow and dim means sleeping.',{x:C,y:C,r:26});return;}
 if(Math.abs(d-(R+12))<7){const g=Math.floor(na/SEG),mid=-Math.PI/2+g*SEG+SEG/2;UI.info('Gate '+GN[g]+': '+(vs.fails.includes(g)?'FAILING':'PASS')+' ('+GND[g]+'). Cracked red segments block entries.',{x:C+Math.cos(mid)*(R+12),y:C+Math.sin(mid)*(R+12),r:14});return;}
 if(vs.pos&&d>R+16&&d<R+38){const v=vs.pos.pct;UI.info('Position aura: moves between the SL ring (inner, red) and TP ring (outer, green). Now '+(v==null?'—':(v>=0?'+':'')+v.toFixed(2)+'%')+'.',{x,y,r:10});return;}
 const i=Math.round(na/(2*Math.PI/N))%N;
 if(d>R+30){const pc=v=>v==null?STR.na:Math.round(v*100)+'%';UI.info(AX[i]+' '+pc(vs.rt[i])+': '+AXD[i]+'. ML attention '+(vs.att?pc(vs.att[i]):STR.na)+', slow lens '+pc(vs.sl[i])+'.',{x:C+Math.cos(ang(i))*(R+50),y:C+Math.sin(ang(i))*(R+50)+2,r:22});return;}
 UI.info(STR.shape,{x,y,r:14});};

// ================================= MAIN LOOP =================================
let lastT=0,fN=0,acc=0,lastM=0,running=true;
document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running){lastT=performance.now()/1000;requestAnimationFrame(loop);}});
function loop(msT){if(!running)return;const t=msT/1000,dt=Math.min(.05,t-lastT);lastT=t;fN++;
 const raw=demoTick(t,dt);            // PRODUCTION: raw = buildRawFromZeusState()
 const st=DERIVED.build(raw);
 REC.tick(t,st);
 let view=st;
 if(UI.rep){UI.rep.idx+=dt*REC_HZ*4;if(UI.rep.idx>=UI.rep.tr.frames.length){UI.rep=null;UI.info(STR.replayEnd);}else view=UI.rep.tr.frames[Math.floor(UI.rep.idx)];}
 acc+=dt;
 if(!(view.zz&&RS.dz>.9&&fN%3)){render(view,t,acc,UI.rep);acc=0;}
 if(t-lastM>.5){lastM=t;updMatch();}
 if(UI.rep){const L=UI.rep.tr.frames.length;drawStrip(UI.rep.tr.frames,UI.rep.idx/L);$('rbar').textContent='REPLAY #'+UI.rep.tr.id+' · '+Math.round(UI.rep.idx/REC_HZ)+'s / '+Math.round(L/REC_HZ)+'s · exit ✕';}
 else if(fN%2===0){drawStrip(REC.frames.slice(-STRIP),null,STRIP);$('rbar').textContent='';}
 REC.snap(t,cv);
 if(UI.infoUntil>0&&performance.now()/1000>UI.infoUntil){UI.infoUntil=0;$('info').textContent=STR.idle;}
 requestAnimationFrame(loop);}
UI.load();$('info').textContent=STR.idle;pickBest();renderJournal();renderPsych();
requestAnimationFrame(loop);
</script></body></html>
