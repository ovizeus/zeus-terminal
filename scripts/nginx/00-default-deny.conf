# [2026-11-27] Server IMPLICIT: orice cerere care nu e pentru zeus-terminal.com (ex. direct pe IP-ul
# serverului, ocolind Cloudflare) e inchisa fara raspuns. Gasit la auditul de dupa atacul cu boti:
# nginx raspundea HTTP 200 pe IP-ul direct. `ssl_reject_handshake` refuza TLS fara certificat.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
