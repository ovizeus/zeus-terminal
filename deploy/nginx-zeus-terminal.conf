# Copy of the live nginx config, /etc/nginx/sites-enabled/zeus-terminal, taken 2026-10-13.
# The repo had no copy, so the live file was the only one. This is a reference
# snapshot for rebuilds, not something deployment reads.
server {
    listen 80;
    server_name zeus-terminal.com www.zeus-terminal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zeus-terminal.com www.zeus-terminal.com;

    ssl_certificate /etc/ssl/zeus/cert.pem;
    ssl_certificate_key /etc/ssl/zeus/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    server_tokens off;

    # [2026-10-13] Source maps are never public. The build emits them as
    # 'hidden' (generated, but no sourceMappingURL comment in the bundle, so no
    # browser ever asks for one) and they are moved out of the served directory
    # straight after the build. This is the belt to that pair of braces: even a
    # map left behind by a half-finished build cannot be fetched. A regex
    # location beats the prefix location /, so this wins over the proxy.
    location ~ \.map$ {
        access_log off;
        return 404;
    }

    # [AUDIT-F5 2026-06-11] Brute-force limit on login (10r/m + burst 5).
    # More-specific location wins for /auth/* ; mirrors the proxy headers of /.
    location /auth/ {
        limit_req zone=zeus_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # [UPLOADS 2026-06-26] Book uploads accept images + docs up to 200MB.
    # Default client_max_body_size (1M) rejected larger files (nginx 502).
    location /api/admin/uploads {
        client_max_body_size 200M;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}